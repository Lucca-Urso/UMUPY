[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=Features --cov=app --cov=project --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = false
omit = ["*/UI/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
